[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-governance-hub"
version = "1.0.0"
description = "A company's front door for AI: intake, explainable risk assessment (EU AI Act, NIST AI RMF, privacy laws), approvals, an AI register, adoption and value tracking, and a monthly leadership report."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Samiul Huda" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pyyaml>=6",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
hub = "governance_hub.cli:main"

[tool.setuptools]
packages = ["governance_hub"]

[tool.setuptools.package-data]
governance_hub = ["rules/*.yaml", "templates/*.html", "static/*"]

[tool.ruff]
line-length = 220
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"governance_hub/seed.py" = ["E501", "SIM108"]
"tests/*.py" = ["E501"]
"eval/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["governance_hub", "eval"]

[[tool.mypy.overrides]]
module = ["uvicorn"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
